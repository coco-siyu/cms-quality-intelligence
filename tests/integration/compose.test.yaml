services:
  backend:
    environment:
      CMSQI_DEPLOYMENT_ENVIRONMENT: preview
      CMSQI_BOOTSTRAP_PREVIEW: "true"
      CMSQI_DEFAULT_FROM_YEAR: "2025"
      CMSQI_DEFAULT_TO_YEAR: "2026"
      CMSQI_ADMIN_USERNAME: compose-admin
      CMSQI_ADMIN_PASSWORD_HASH: ${CMSQI_TEST_ADMIN_PASSWORD_HASH:?Set CMSQI_TEST_ADMIN_PASSWORD_HASH}
      CMSQI_ADMIN_SESSION_SECRET: compose-integration-session-secret-not-for-deployment
      CMSQI_ADMIN_SESSION_SECURE: "false"
      CMSQI_ADMIN_SESSION_TTL_SECONDS: "3600"
      CMSQI_OPENAI_API_KEY: ""
      CMSQI_AI_CLARIFICATION_MODEL: ""
      CMSQI_AI_SEMANTIC_MODEL: ""
      CMSQI_AI_IMPACT_MODEL: ""

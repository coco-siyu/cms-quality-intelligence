    IngestionItemStage:
      type: string
      enum: [pending, downloading, extracting, comparing, awaiting_verification, unchanged, failed]
    AdminIngestionEvent:
      type: object
      required: [event_id, stage, occurred_at, detail]
      properties:
        event_id: {type: string}
        stage:
          $ref: "#/components/schemas/IngestionItemStage"
        occurred_at: {type: string, format: date-time}
        detail: {type: [string, "null"]}
    AdminIngestionItem:
      type: object
      required:
        - item_id
        - sequence
        - source_id
        - source_title
        - stage
        - source_check_id
        - source_check_outcome
        - started_at
        - completed_at
        - error
        - events
      properties:
        item_id: {type: string}
        sequence: {type: integer, minimum: 1}
        source_id: {type: string}
        source_title: {type: string}
        stage:
          $ref: "#/components/schemas/IngestionItemStage"
        source_check_id: {type: [string, "null"]}
        source_check_outcome:
          oneOf:
            - $ref: "#/components/schemas/SourceCheckOutcome"
            - type: "null"
        started_at: {type: [string, "null"], format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        error: {type: [string, "null"]}
        events:
          type: array
          items:
            $ref: "#/components/schemas/AdminIngestionEvent"
    AdminIngestionRun:
      type: object
      required:
        - run_id
        - status
        - source_count
        - completed_count
        - failed_count
        - started_at
        - completed_at
        - created_by
        - items
      properties:
        run_id: {type: string}
        status:
          $ref: "#/components/schemas/IngestionRunStatus"
        source_count: {type: integer, minimum: 0}
        completed_count: {type: integer, minimum: 0}
        failed_count: {type: integer, minimum: 0}
        started_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
        created_by: {type: string}
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminIngestionItem"
    AdminIngestionRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminIngestionRun"
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true

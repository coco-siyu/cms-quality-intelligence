openapi: 3.1.0
info:
  title: CMS Quality Intelligence API
  version: 0.1.0
  description: |
    Public measure browsing and protected review/publication of staged CMS
    evidence. Public endpoints return only individually approved, evidenced
    fields; sibling drafts remain confined to authenticated admin endpoints.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: System
  - name: Public measures
  - name: Admin review
  - name: Admin sources
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API availability
      responses:
        "200":
          description: API process is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/performance-years:
    get:
      operationId: listPerformanceYears
      tags: [Public measures]
      summary: List publicly available performance years
      responses:
        "200":
          description: Available performance years and the default comparison pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceYearList"
  /api/measures:
    get:
      operationId: listMeasures
      tags: [Public measures]
      summary: Search and filter publicly approved measures
      description: |
        Returns only fields approved for public release. Absence from extracted
        source material must not be interpreted as removal from a program.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PerformanceYear"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
        - $ref: "#/components/parameters/ChangeStatus"
        - $ref: "#/components/parameters/AffectedField"
        - $ref: "#/components/parameters/VerificationStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated public measure results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasurePage"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}:
    get:
      operationId: getMeasure
      tags: [Public measures]
      summary: Get a publicly approved measure profile
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
      responses:
        "200":
          description: Public measure identity, version summaries, evidence, and freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasureDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}/versions:
    get:
      operationId: listMeasureVersions
      tags: [Public measures]
      summary: List publicly approved year-specific measure versions
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: performance_year
          in: query
          required: false
          description: Optionally select one available performance year.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: Approved versions with explicit field availability states.
          content:
            application/json:
              schema:
                type: object
                required: [measure_id, versions]
                properties:
                  measure_id:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeasureVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/session:
    get:
      operationId: getAdminSession
      tags: [Admin review]
      summary: Inspect administrator authentication state
      responses:
        "200":
          description: Current authentication and configuration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: createAdminSession
      tags: [Admin review]
      summary: Create a secure administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated session. The signed token is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "503":
          description: Administrator authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminSession
      tags: [Admin review]
      summary: End the current administrator session
      responses:
        "200":
          description: The browser session cookie has been cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /api/admin/review-summary:
    get:
      operationId: getAdminReviewSummary
      tags: [Admin review]
      summary: Count private records awaiting review
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Private staging counts; no record is published by this operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReviewSummary"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /api/admin/measures:
    get:
      operationId: listAdminMeasures
      tags: [Admin review]
      summary: List measures with private fields staged for review
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated review records, including partially published measures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeasurePage"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/measures/{measure_id}:
    get:
      operationId: getAdminMeasure
      tags: [Admin review]
      summary: Inspect a measure's private source-backed field candidates
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/MeasureId"
      responses:
        "200":
          description: Private candidates plus their independent publication states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeasureDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/review-items/{review_item_id}:
    patch:
      operationId: reviewAdminFieldCandidate
      tags: [Admin review]
      summary: Record a review decision for one private field candidate
      description: |
        Updates the current private review state and appends an immutable audit event.
        This operation never publishes a measure or exposes the candidate publicly.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: review_item_id
          in: path
          required: true
          description: Stable identifier for the private field candidate under review.
          schema:
            type: string
            minLength: 1
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          description: Explicit acknowledgement of the private review mutation.
          schema:
            type: string
            const: review-decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCandidateDecisionRequest"
      responses:
        "200":
          description: Updated private candidate including its append-only review history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFieldCandidate"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          description: The explicit administrator action header is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval is blocked because newer source evidence was detected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/review-items/{review_item_id}/publish:
    post:
      operationId: publishAdminFieldCandidate
      tags: [Admin review]
      summary: Publish one independently approved and evidenced field
      description: |
        Materializes only the selected reviewed value and its immutable evidence.
        Pending, rejected, unsupported, excerpt-free, or stale sibling candidates
        remain private. Repeating a successful request is idempotent.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: review_item_id
          in: path
          required: true
          description: Stable identifier for the approved private field candidate.
          schema:
            type: string
            minLength: 1
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          description: Explicit acknowledgement of the field publication transaction.
          schema:
            type: string
            const: publish-field
      responses:
        "200":
          description: Candidate linked to its public field and immutable evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFieldCandidate"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          description: The explicit administrator action header is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The field is not eligible for safe partial publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/sources:
    get:
      operationId: listAdminSources
      tags: [Admin sources]
      summary: List registered official CMS sources and retrieval state
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Private source registry with latest revision and check state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceList"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
    post:
      operationId: createAdminSource
      tags: [Admin sources]
      summary: Register an allowlisted official cms.gov source
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SourceRegistryAction"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSourceCreateRequest"
      responses:
        "201":
          description: Source registered without fetching or publishing it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/ingestion-runs:
    get:
      tags: [Admin sources]
      operationId: listAdminIngestionRuns
      summary: List recent private source ingestion runs.
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Recent persisted ingestion runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIngestionRunList"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
    post:
      tags: [Admin sources]
      operationId: createAdminIngestionRun
      summary: Check every active registered CMS source for updates.
      description: |
        Creates a durable private run before retrieval begins. Each source moves through
        bounded download, extraction, content comparison, and verification staging. This
        operation never publishes measure records.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IngestionRunAction"
      responses:
        "201":
          description: The bounded ingestion run and its persisted outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIngestionRun"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/ingestion-runs/{run_id}:
    get:
      tags: [Admin sources]
      operationId: getAdminIngestionRun
      summary: Read one persisted private ingestion run.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: The ingestion run and source-level event trails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIngestionRun"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/sources/{source_id}:
    get:
      operationId: getAdminSource
      tags: [Admin sources]
      summary: Inspect source revisions and append-only check history
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Registered source, revisions, extractions, and check events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAdminSource
      tags: [Admin sources]
      summary: Update or deactivate a registered CMS source
      description: Deactivation preserves every historical revision and check event.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/SourceRegistryAction"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSourceUpdateRequest"
      responses:
        "200":
          description: Updated registry metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/sources/{source_id}/check:
    post:
      operationId: checkAdminSource
      tags: [Admin sources]
      summary: Fetch and extract one active registered CMS source
      description: |
        Every redirect is revalidated against the cms.gov allowlist. New content
        creates an immutable revision. Unchanged content creates only a check event;
        force=true creates a new extraction for the existing revision.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/SourceCheckAction"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSourceCheckRequest"
      responses:
        "200":
          description: Updated source state after the audited retrieval attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Fetch, content validation, or extraction retrieval failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/source-extractions/{extraction_id}:
    get:
      operationId: getAdminSourceExtraction
      tags: [Admin sources]
      summary: Inspect extracted source text with evidence locators
      security:
        - AdminSessionCookie: []
      parameters:
        - name: extraction_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Append-only extraction metadata and ordered text segments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceExtractionDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/source-extractions/{extraction_id}/normalize:
    post:
      operationId: normalizeAdminSourceExtraction
      tags: [Admin sources]
      summary: Produce private normalized measure-field candidates
      description: |
        Uses deterministic labeled-field rules and exact stored identity matching.
        Ambiguous or incomplete results remain private unresolved candidates; this
        operation never verifies or publishes a value.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: extraction_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: "#/components/parameters/SourceNormalizationAction"
      responses:
        "200":
          description: Idempotent normalization result and private staging state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceNormalizationDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/source-normalizations/{normalization_id}:
    get:
      operationId: getAdminSourceNormalization
      tags: [Admin sources]
      summary: Inspect normalized identities, fields, and evidence pointers
      security:
        - AdminSessionCookie: []
      parameters:
        - name: normalization_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Private typed candidates and their review-queue staging state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceNormalizationDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/normalized-fields/{field_candidate_id}/clarifications:
    post:
      operationId: clarifyAdminNormalizedField
      tags: [Admin sources]
      summary: Request a private evidence-bounded clarification proposal
      description: |
        Retrieves bounded excerpts from additional registered official CMS sources
        and requests a schema-validated proposal for one unresolved normalized field.
        The result remains private and cannot approve, verify, or publish a value.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: field_candidate_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: "#/components/parameters/SourceClarificationAction"
      responses:
        "200":
          description: Private clarification proposal with validated official evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClarificationProposal"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: The configured model provider failed or returned invalid evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Optional AI clarification has not been configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: cmsqi_admin_session
  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    SourceRegistryAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: source-registry
    SourceCheckAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: source-check
    SourceNormalizationAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: normalize-source
    SourceClarificationAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: clarify-source
    IngestionRunAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: check-for-updates
    MeasureId:
      name: measure_id
      in: path
      required: true
      description: Stable application measure identifier.
      schema:
        type: string
        minLength: 1
    SearchQuery:
      name: q
      in: query
      required: false
      description: Search approved measure ID, name, or description.
      schema:
        type: string
        maxLength: 200
    PerformanceYear:
      name: performance_year
      in: query
      required: false
      description: Require publicly verified membership in this performance year.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    FromYear:
      name: from_year
      in: query
      required: false
      description: Baseline performance year for the requested comparison.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    ToYear:
      name: to_year
      in: query
      required: false
      description: Comparison performance year for the requested comparison.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    ChangeStatus:
      name: change_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ChangeStatus"
    AffectedField:
      name: affected_field
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AffectedField"
    VerificationStatus:
      name: verification_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PublicVerificationStatus"
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    AdminActionForbidden:
      description: The explicit administrator action header is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AdminUnauthorized:
      description: A valid administrator session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The requested public resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The requested mutation conflicts with current source state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: One or more request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ChangeStatus:
      type: string
      description: |
        Approved year-pair comparison state. `unknown` is distinct from a
        verified removal and is used when evidence is incomplete.
      enum: [added, removed, modified, unchanged, unknown]
    AffectedField:
      type: string
      enum:
        - measure_set
        - definition
        - numerator
        - denominator
        - exclusions
        - eligibility
        - calculation_logic
    PublicVerificationStatus:
      type: string
      description: Public-safe verification or freshness state.
      enum: [verified, partially_verified, source_update_detected]
    FieldAvailability:
      type: string
      description: Explicitly distinguishes a value from unavailable or unresolved evidence.
      enum: [available, unavailable, unresolved]
    PerformanceYearList:
      type: object
      required: [years, default_from_year, default_to_year]
      properties:
        years:
          type: array
          items:
            type: integer
          minItems: 1
          uniqueItems: true
        default_from_year:
          type: integer
        default_to_year:
          type: integer
      example:
        years: [2025, 2026]
        default_from_year: 2025
        default_to_year: 2026
    EvidenceReference:
      type: object
      required: [evidence_id, source_revision_id, document_title, official_url, excerpt]
      properties:
        evidence_id:
          type: string
        source_revision_id:
          type: string
        document_title:
          type: string
        official_url:
          type: string
          format: uri
          pattern: "^https://"
        locator:
          type: [string, "null"]
          description: Page, section, or another stable locator when available.
        excerpt:
          type: string
    Freshness:
      type: object
      required: [last_source_check_at, verification_status]
      properties:
        last_verified_at:
          type: [string, "null"]
          format: date-time
        last_source_check_at:
          type: string
          format: date-time
        verification_status:
          $ref: "#/components/schemas/PublicVerificationStatus"
        newer_revision_detected:
          type: boolean

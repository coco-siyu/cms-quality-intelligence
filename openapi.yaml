openapi: 3.1.0
info:
  title: CMS Quality Intelligence API
  version: 0.1.0
  description: |
    Public measure browsing and protected review/publication of staged CMS
    evidence. Public endpoints return only individually approved, evidenced
    fields; sibling drafts remain confined to authenticated admin endpoints.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: System
  - name: Public measures
  - name: Public changes
  - name: Admin review
  - name: Admin sources
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API availability
      responses:
        "200":
          description: API process is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/performance-years:
    get:
      operationId: listPerformanceYears
      tags: [Public measures]
      summary: List publicly available performance years
      responses:
        "200":
          description: Available performance years and the default comparison pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceYearList"
  /api/measures:
    get:
      operationId: listMeasures
      tags: [Public measures]
      summary: Search and filter publicly approved measures
      description: |
        Returns only fields approved for public release. Absence from extracted
        source material must not be interpreted as removal from a program.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PerformanceYear"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
        - $ref: "#/components/parameters/ChangeStatus"
        - $ref: "#/components/parameters/AffectedField"
        - $ref: "#/components/parameters/VerificationStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated public measure results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasurePage"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}:
    get:
      operationId: getMeasure
      tags: [Public measures]
      summary: Get a publicly approved measure profile
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
      responses:
        "200":
          description: Public measure identity, version summaries, evidence, and freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasureDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}/navigation:
    get:
      operationId: getMeasureNavigation
      tags: [Public measures]
      summary: Get filtered Previous/Next measure navigation
      description: |
        Resolves the selected measure's position and adjacent stable IDs using
        the same public filters and measure-ID ordering as the directory.
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PerformanceYear"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
        - $ref: "#/components/parameters/ChangeStatus"
        - $ref: "#/components/parameters/AffectedField"
        - $ref: "#/components/parameters/VerificationStatus"
      responses:
        "200":
          description: Position and adjacent IDs within the filtered public directory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasureNavigation"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}/versions:
    get:
      operationId: listMeasureVersions
      tags: [Public measures]
      summary: List publicly approved year-specific measure versions
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: performance_year
          in: query
          required: false
          description: Optionally select one available performance year.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: Approved versions with explicit field availability states.
          content:
            application/json:
              schema:
                type: object
                required: [measure_id, versions]
                properties:
                  measure_id:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeasureVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/changes:
    get:
      operationId: listChanges
      tags: [Public changes]
      summary: List approved, evidence-backed year-over-year changes
      description: |
        Returns only published comparisons that still pass public evidence
        validation. Pagination is applied after that validation so totals never
        include stale, incomplete, private, or draft records.
      parameters:
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
        - $ref: "#/components/parameters/ChangeStatus"
        - $ref: "#/components/parameters/AffectedField"
        - name: collection_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CollectionType"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated public comparisons with field values and evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChangePage"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/changes/{measure_id}:
    get:
      operationId: getChange
      tags: [Public changes]
      summary: Get one approved side-by-side measure comparison
      description: |
        The complete public comparison identity is required because one stable
        measure may have different program or collection-specific variants.
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: program
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: collection_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CollectionType"
        - name: from_year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
        - name: to_year
          in: query
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: Approved comparison with changed fields and official evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChangeRecord"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/changes/{measure_id}/impact-explanation:
    get:
      operationId: getImpactExplanation
      tags: [Public changes]
      summary: Get the current approved role-specific explanation pair
      description: |
        Returns the newest human-approved and explicitly published explanation
        pair only while its comparison, input digest, and cited evidence remain
        current. Pending, rejected, withdrawn, and outdated versions return 404.
        Both role perspectives are returned together so switching roles never
        triggers a model call.
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: program
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: collection_type
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CollectionType"
        - name: from_year
          in: query
          required: true
          schema: {type: integer, minimum: 2000, maximum: 2100}
        - name: to_year
          in: query
          required: true
          schema: {type: integer, minimum: 2000, maximum: 2100}
      responses:
        "200":
          description: One approved stored explanation pair and its official evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicImpactExplanation"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/session:
    get:
      operationId: getAdminSession
      tags: [Admin review]
      summary: Inspect administrator authentication state
      responses:
        "200":
          description: Current authentication and configuration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: createAdminSession
      tags: [Admin review]
      summary: Create a secure administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated session. The signed token is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "503":
          description: Administrator authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminSession
      tags: [Admin review]
      summary: End the current administrator session
      responses:
        "200":
          description: The browser session cookie has been cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /api/admin/review-summary:
    get:
      operationId: getAdminReviewSummary
      tags: [Admin review]
      summary: Count private records awaiting review
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Private staging counts; no record is published by this operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReviewSummary"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /api/admin/measures:
    get:
      operationId: listAdminMeasures
      tags: [Admin review]
      summary: List measures with private fields staged for review
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated review records, including partially published measures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeasurePage"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/measures/{measure_id}:
    get:
      operationId: getAdminMeasure
      tags: [Admin review]
      summary: Inspect a measure's private source-backed field candidates
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/MeasureId"
      responses:
        "200":
          description: Private candidates plus their independent publication states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeasureDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/comparisons:
    get:
      operationId: listAdminComparisons
      tags: [Admin review]
      summary: List private comparisons prepared for evidence review
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
        - name: collection_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CollectionType"
            default: program_roster
      responses:
        "200":
          description: Private comparisons with evidence, review state, and publication eligibility.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComparisonPage"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/comparisons/generate:
    post:
      operationId: generateAdminComparisons
      tags: [Admin review]
      summary: Prepare deterministic private roster comparisons
      description: |
        Compares only verified, published year-specific roster versions that exist
        for both years. One-sided records remain skipped; absence is never inferred
        as an addition or removal. Repeating this request is idempotent.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          schema:
            type: string
            const: prepare-comparisons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminComparisonGenerationRequest"
      responses:
        "200":
          description: Counts for prepared, existing, and safely skipped comparisons.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComparisonGenerationResponse"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/comparisons/{comparison_id}:
    patch:
      operationId: reviewAdminComparison
      tags: [Admin review]
      summary: Record an audited private comparison review
      description: Approval requires complete current evidence and a resolved comparison status.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: comparison_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          schema:
            type: string
            const: review-comparison
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminComparisonDecisionRequest"
      responses:
        "200":
          description: Updated comparison with append-only review history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComparison"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/comparisons/{comparison_id}/impact-explanations:
    get:
      operationId: listAdminImpactExplanationDrafts
      tags: [Admin review]
      summary: List private generated impact-explanation drafts
      description: |
        Returns immutable structured generation results for administrator review.
        Review and publication metadata are included, but this endpoint does not
        itself approve or publish an explanation.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: comparison_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Private, versioned impact-explanation drafts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImpactExplanationDraftPage"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/comparisons/{comparison_id}/impact-explanations/generate:
    post:
      operationId: generateAdminImpactExplanationDraft
      tags: [Admin review]
      summary: Generate or reuse a private impact-explanation draft
      description: |
        Calls the configured structured-output provider only after an explicit
        administrator action. The approved comparison and exact official
        excerpts form the complete input. A valid result remains private and
        repeating the same provider/model/prompt/input combination is idempotent.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: comparison_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          schema:
            type: string
            const: generate-impact-explanation
      responses:
        "200":
          description: A validated private draft; this may be an idempotently reused draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImpactExplanationDraft"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: The configured structured-output provider request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Impact generation is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/comparisons/{comparison_id}/impact-explanations/regenerate:
    post:
      operationId: regenerateAdminImpactExplanationDraft
      tags: [Admin review]
      summary: Append a regenerated private impact-explanation draft
      description: |
        Calls the configured structured-output provider after an explicit
        administrator action and always creates a new private version. Prior
        generated output, reviewed wording, decisions, publication metadata,
        and citations remain unchanged. The action requires at least one prior
        draft and currently approved comparison evidence.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: comparison_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          schema:
            type: string
            const: regenerate-impact-explanation
      responses:
        "200":
          description: A newly generated, private, pending-review draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImpactExplanationDraft"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: The configured structured-output provider request failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Impact generation is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/impact-explanations/{draft_id}:
    patch:
      operationId: reviewAdminImpactExplanationDraft
      tags: [Admin review]
      summary: Review one complete role-specific explanation pair
      description: |
        Stores human-edited approved wording separately from the immutable
        generated output, or rejects the complete pair. A decision is final for
        this draft version and does not publish it.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 120}
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          schema:
            type: string
            const: review-impact-explanation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminImpactExplanationReviewRequest"
      responses:
        "200":
          description: The privately reviewed explanation version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImpactExplanationDraft"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/impact-explanations/{draft_id}/publish:
    post:
      operationId: publishAdminImpactExplanationDraft
      tags: [Admin review]
      summary: Publish one approved role-specific explanation pair
      description: |
        Publishes only a current, human-approved pair whose comparison is
        already public. Any older published pair for the same comparison is
        withdrawn but retained privately.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: draft_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 120}
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          schema:
            type: string
            const: publish-impact-explanation
      responses:
        "200":
          description: The explicitly published explanation version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImpactExplanationDraft"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/comparisons/{comparison_id}/publish:
    post:
      operationId: publishAdminComparison
      tags: [Admin review]
      summary: Publish one approved evidence-backed comparison
      description: |
        Publication is explicit and idempotent. Draft, unapproved, incomplete,
        unresolved, or private-measure comparisons cannot cross the public boundary.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: comparison_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          schema:
            type: string
            const: publish-comparison
      responses:
        "200":
          description: Published comparison, including publisher and publication time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminComparison"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/review-items/{review_item_id}:
    patch:
      operationId: reviewAdminFieldCandidate
      tags: [Admin review]
      summary: Record a review decision for one private field candidate
      description: |
        Updates the current private review state and appends an immutable audit event.
        This operation never publishes a measure or exposes the candidate publicly.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: review_item_id
          in: path
          required: true
          description: Stable identifier for the private field candidate under review.
          schema:
            type: string
            minLength: 1
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          description: Explicit acknowledgement of the private review mutation.
          schema:
            type: string
            const: review-decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCandidateDecisionRequest"
      responses:
        "200":
          description: Updated private candidate including its append-only review history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFieldCandidate"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          description: The explicit administrator action header is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval is blocked because newer source evidence was detected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/review-items/{review_item_id}/publish:
    post:
      operationId: publishAdminFieldCandidate
      tags: [Admin review]
      summary: Publish one independently approved and evidenced field
      description: |
        Materializes only the selected reviewed value and its immutable evidence.
        Pending, rejected, unsupported, excerpt-free, or stale sibling candidates
        remain private. Repeating a successful request is idempotent.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: review_item_id
          in: path
          required: true
          description: Stable identifier for the approved private field candidate.
          schema:
            type: string
            minLength: 1
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          description: Explicit acknowledgement of the field publication transaction.
          schema:
            type: string
            const: publish-field
      responses:
        "200":
          description: Candidate linked to its public field and immutable evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFieldCandidate"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          description: The explicit administrator action header is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The field is not eligible for safe partial publication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/sources:
    get:
      operationId: listAdminSources
      tags: [Admin sources]
      summary: List registered official CMS sources and retrieval state
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Private source registry with latest revision and check state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceList"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
    post:
      operationId: createAdminSource
      tags: [Admin sources]
      summary: Register an allowlisted official cms.gov source
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SourceRegistryAction"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSourceCreateRequest"
      responses:
        "201":
          description: Source registered without fetching or publishing it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/ingestion-runs:
    get:
      tags: [Admin sources]
      operationId: listAdminIngestionRuns
      summary: List recent private source ingestion runs.
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Recent persisted ingestion runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIngestionRunList"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
    post:
      tags: [Admin sources]
      operationId: createAdminIngestionRun
      summary: Check every active registered CMS source for updates.
      description: |
        Creates a durable private run before retrieval begins. Each source moves through
        bounded download, extraction, content comparison, and verification staging. This
        operation never publishes measure records.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IngestionRunAction"
      responses:
        "202":
          description: The durable running ingestion record accepted for background processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIngestionRun"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/ingestion-runs/{run_id}:
    get:
      tags: [Admin sources]
      operationId: getAdminIngestionRun
      summary: Read one persisted private ingestion run.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: The ingestion run and source-level event trails.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIngestionRun"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/sources/{source_id}:
    get:
      operationId: getAdminSource
      tags: [Admin sources]
      summary: Inspect source revisions and append-only check history
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Registered source, revisions, extractions, and check events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAdminSource
      tags: [Admin sources]
      summary: Update or deactivate a registered CMS source
      description: Deactivation preserves every historical revision and check event.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/SourceRegistryAction"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSourceUpdateRequest"
      responses:
        "200":
          description: Updated registry metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/sources/{source_id}/check:
    post:
      operationId: checkAdminSource
      tags: [Admin sources]
      summary: Fetch and extract one active registered CMS source
      description: |
        Every redirect is revalidated against the cms.gov allowlist. New content
        creates an immutable revision. Unchanged content creates only a check event;
        force=true creates a new extraction for the existing revision.
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SourceId"
        - $ref: "#/components/parameters/SourceCheckAction"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSourceCheckRequest"
      responses:
        "200":
          description: Updated source state after the audited retrieval attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: Fetch, content validation, or extraction retrieval failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/admin/source-extractions/{extraction_id}:
    get:
      operationId: getAdminSourceExtraction
      tags: [Admin sources]
      summary: Inspect extracted source text with evidence locators
      security:
        - AdminSessionCookie: []
      parameters:
        - name: extraction_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
      responses:
        "200":
          description: Append-only extraction metadata and ordered text segments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceExtractionDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/source-extractions/{extraction_id}/normalize:
    post:
      operationId: normalizeAdminSourceExtraction
      tags: [Admin sources]
      summary: Produce private normalized measure-field candidates
      description: |
        Uses deterministic labeled-field rules and exact stored identity matching.
        Ambiguous or incomplete results remain private unresolved candidates; this
        operation never verifies or publishes a value.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: extraction_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - $ref: "#/components/parameters/SourceNormalizationAction"
      responses:
        "200":
          description: Idempotent normalization result and private staging state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceNormalizationDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/admin/source-normalizations/{normalization_id}:
    get:
      operationId: getAdminSourceNormalization
      tags: [Admin sources]
      summary: Inspect normalized identities, fields, and evidence pointers
      security:
        - AdminSessionCookie: []
      parameters:
        - name: normalization_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Private typed candidates and their review-queue staging state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSourceNormalizationDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/normalized-fields/{field_candidate_id}/clarifications:
    post:
      operationId: clarifyAdminNormalizedField
      tags: [Admin sources]
      summary: Request a private evidence-bounded clarification proposal
      description: |
        Retrieves bounded excerpts from additional registered official CMS sources
        and requests a schema-validated proposal for one unresolved normalized field.
        The result remains private and cannot approve, verify, or publish a value.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: field_candidate_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - $ref: "#/components/parameters/SourceClarificationAction"
      responses:
        "200":
          description: Private clarification proposal with validated official evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClarificationProposal"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          $ref: "#/components/responses/AdminActionForbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          description: The configured model provider failed or returned invalid evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Optional AI clarification has not been configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: cmsqi_admin_session
  parameters:
    SourceId:
      name: source_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    SourceRegistryAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: source-registry
    SourceCheckAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: source-check
    SourceNormalizationAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: normalize-source
    SourceClarificationAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: clarify-source
    IngestionRunAction:
      name: X-CMSQI-Admin-Action
      in: header
      required: true
      schema:
        type: string
        const: check-for-updates
    MeasureId:
      name: measure_id
      in: path
      required: true
      description: Stable application measure identifier.
      schema:
        type: string
        minLength: 1
    SearchQuery:
      name: q
      in: query
      required: false
      description: Search approved measure ID, name, or description.
      schema:
        type: string
        maxLength: 200
    PerformanceYear:
      name: performance_year
      in: query
      required: false
      description: Require publicly verified membership in this performance year.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    FromYear:
      name: from_year
      in: query
      required: false
      description: Baseline performance year for the requested comparison.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    ToYear:
      name: to_year
      in: query
      required: false
      description: Comparison performance year for the requested comparison.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    ChangeStatus:
      name: change_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ChangeStatus"
    AffectedField:
      name: affected_field
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AffectedField"
    VerificationStatus:
      name: verification_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PublicVerificationStatus"
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    AdminActionForbidden:
      description: The explicit administrator action header is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AdminUnauthorized:
      description: A valid administrator session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The requested public resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The requested mutation conflicts with current source state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: One or more request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ChangeStatus:
      type: string
      description: |
        Approved year-pair comparison state. `wording_only` is reserved for a
        reviewed semantic finding; deterministic text inequality alone is
        `modified`. `unknown` is distinct from a verified removal and is
        required when either side is unresolved.
      enum: [added, removed, modified, wording_only, unchanged, unknown]
    ChangeEvidenceSide:
      type: string
      description: Identifies which year-version an evidence reference supports.
      enum: [from_version, to_version, context]
    ComparisonEvidenceStatus:
      type: string
      description: Structural evidence coverage for a stored comparison.
      enum: [pending, verified, incomplete]
    AffectedField:
      type: string
      enum:
        - measure_set
        - definition
        - numerator
        - denominator
        - exclusions
        - eligibility
        - calculation_logic
    PublicVerificationStatus:
      type: string
      description: Public-safe verification or freshness state.
      enum: [verified, partially_verified, source_update_detected]
    FieldAvailability:
      type: string
      description: Explicitly distinguishes a value from unavailable or unresolved evidence.
      enum: [available, unavailable, unresolved]
    PerformanceYearList:
      type: object
      required: [years, default_from_year, default_to_year]
      properties:
        years:
          type: array
          items:
            type: integer
          minItems: 1
          uniqueItems: true
        default_from_year:
          type: integer
        default_to_year:
          type: integer
      example:
        years: [2025, 2026]
        default_from_year: 2025
        default_to_year: 2026
    EvidenceReference:
      type: object
      required: [evidence_id, source_revision_id, document_title, official_url, publication_date, effective_date, excerpt]
      properties:
        evidence_id:
          type: string
        source_revision_id:
          type: string
        document_title:
          type: string
        official_url:
          type: string
          format: uri
          pattern: "^https://"
        publication_date:
          type: [string, "null"]
          format: date
          description: Date CMS published or revised this source, when documented.
        effective_date:
          type: [string, "null"]
          format: date
          description: Effective or applicability date documented by CMS, when available.
        locator:
          type: [string, "null"]
          description: Page, section, or another stable locator when available.
        excerpt:
          type: string
    Freshness:
      type: object
      required: [last_source_check_at, verification_status]
      properties:
        last_verified_at:
          type: [string, "null"]
          format: date-time
        last_source_check_at:
          type: string
          format: date-time
        verification_status:
          $ref: "#/components/schemas/PublicVerificationStatus"
        newer_revision_detected:
          type: boolean
    SpecificationField:
      type: object
      required: [field, availability, value, evidence]
      properties:
        field:
          $ref: "#/components/schemas/AffectedField"
        availability:
          $ref: "#/components/schemas/FieldAvailability"
        value:
          type: [string, "null"]
          description: Null unless an approved public value is available.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
    ChangeFieldEvidence:
      allOf:
        - $ref: "#/components/schemas/EvidenceReference"
        - type: object
          required: [side]
          properties:
            side:
              $ref: "#/components/schemas/ChangeEvidenceSide"
    ChangeField:
      type: object
      description: |
        One field-level comparison. If either availability is `unresolved`,
        status must be `unknown`; absence alone never proves removal.
      required:
        - field
        - status
        - from_availability
        - to_availability
        - from_value
        - to_value
        - evidence
      properties:
        field:
          $ref: "#/components/schemas/AffectedField"
        status:
          $ref: "#/components/schemas/ChangeStatus"
        from_availability:
          $ref: "#/components/schemas/FieldAvailability"
        to_availability:
          $ref: "#/components/schemas/FieldAvailability"
        from_value:
          type: [string, "null"]
        to_value:
          type: [string, "null"]
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ChangeFieldEvidence"
    PublicChangeRecord:
      type: object
      description: Approved, evidence-backed comparison for one measure and year pair.
      required:
        - measure_id
        - measure_name
        - program
        - collection_type
        - from_year
        - to_year
        - status
        - evidence_status
        - approved_at
        - published_at
        - fields
      properties:
        measure_id:
          type: string
        measure_name:
          type: string
        program:
          type: string
        collection_type:
          $ref: "#/components/schemas/CollectionType"
        from_year:
          type: integer
          minimum: 2000
          maximum: 2100
        to_year:
          type: integer
          minimum: 2000
          maximum: 2100
        status:
          $ref: "#/components/schemas/ChangeStatus"
        evidence_status:
          $ref: "#/components/schemas/ComparisonEvidenceStatus"
        approved_at:
          type: string
          format: date-time
          description: Time the internal human review approved this comparison.
        published_at:
          type: string
          format: date-time
          description: Time the approved comparison became public in this application.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ChangeField"
    ImpactStatementType:
      type: string
      description: Distinguishes an evidence-backed fact from a qualified possible impact.
      enum: [source_fact, possible_impact]
    ImpactCitation:
      type: object
      additionalProperties: false
      required: [evidence_id]
      properties:
        evidence_id:
          type: string
          minLength: 1
          maxLength: 120
    ImpactStatement:
      type: object
      additionalProperties: false
      description: |
        One bounded statement with exact evidence IDs. Production-ready SQL,
        severity scores, confidence scores, and unsupported regulatory
        conclusions are outside this contract.
      required: [statement, statement_type, citations]
      properties:
        statement:
          type: string
          minLength: 1
          maxLength: 2000
        statement_type:
          $ref: "#/components/schemas/ImpactStatementType"
        citations:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/ImpactCitation"
    DataAnalystImpact:
      type: object
      additionalProperties: false
      required: [technical_implications, validation_considerations]
      properties:
        technical_implications:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/ImpactStatement"
        validation_considerations:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/ImpactStatement"
    ACOQualityManagerImpact:
      type: object
      additionalProperties: false
      required: [operational_implications, coordination_considerations]
      properties:
        operational_implications:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/ImpactStatement"
        coordination_considerations:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/ImpactStatement"
    ImpactUncertaintyCaveat:
      type: object
      additionalProperties: false
      required: [statement, citations]
      properties:
        statement:
          type: string
          minLength: 1
          maxLength: 1000
        citations:
          type: array
          maxItems: 12
          description: May be empty when the caveat identifies missing evidence.
          items:
            $ref: "#/components/schemas/ImpactCitation"
    ImpactExplanationOutput:
      type: object
      additionalProperties: false
      description: |
        Provider-independent paired explanation contract for one approved,
        evidence-backed comparison. This component does not imply generation,
        approval, persistence, or public availability.
      required:
        - plain_language_summary
        - data_analyst
        - aco_quality_manager
        - uncertainty_caveats
      properties:
        plain_language_summary:
          $ref: "#/components/schemas/ImpactStatement"
        data_analyst:
          $ref: "#/components/schemas/DataAnalystImpact"
        aco_quality_manager:
          $ref: "#/components/schemas/ACOQualityManagerImpact"
        uncertainty_caveats:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/ImpactUncertaintyCaveat"
    PublicImpactExplanation:
      type: object
      additionalProperties: false
      description: |
        The latest human-approved, explicitly published, and currently valid
        role-specific explanation pair for one public comparison.
      required:
        - measure_id
        - measure_name
        - program
        - collection_type
        - from_year
        - to_year
        - approved_at
        - published_at
        - output
        - evidence
      properties:
        measure_id: {type: string}
        measure_name: {type: string}
        program: {type: string}
        collection_type:
          $ref: "#/components/schemas/CollectionType"
        from_year: {type: integer, minimum: 2000, maximum: 2100}
        to_year: {type: integer, minimum: 2000, maximum: 2100}
        approved_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
        output:
          $ref: "#/components/schemas/ImpactExplanationOutput"
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ChangeFieldEvidence"
    PublicChangePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicChangeRecord"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    MeasureVersion:
      type: object
      required:
        - version_id
        - performance_year
        - program
        - is_program_member
        - fields
      properties:
        version_id:
          type: string
        performance_year:
          type: integer
        program:
          type: string
        is_program_member:
          type: boolean
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SpecificationField"
    PublicMeasureSummary:
      type: object
      required:
        - measure_id
        - name
        - description
        - performance_years
        - change_status
        - affected_fields
        - freshness
      properties:
        measure_id:
          type: string
        name:
          type: string
        description:
          type: string
        performance_years:
          type: array
          items:
            type: integer
          uniqueItems: true
        change_status:
          $ref: "#/components/schemas/ChangeStatus"
        affected_fields:
          type: array
          items:
            $ref: "#/components/schemas/AffectedField"
          uniqueItems: true
        freshness:
          $ref: "#/components/schemas/Freshness"
      example:
        measure_id: DEMO-001
        name: Fictional Preventive Care Measure
        description: Explicitly fictional contract example; not a verified CMS measure.
        performance_years: [2025, 2026]
        change_status: unknown
        affected_fields: []
        freshness:
          last_verified_at: null
          last_source_check_at: "2026-10-16T12:00:00Z"
          verification_status: partially_verified
          newer_revision_detected: false
    PublicMeasureDetail:
      allOf:
        - $ref: "#/components/schemas/PublicMeasureSummary"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/MeasureVersion"
    PaginationMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    PublicMeasurePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicMeasureSummary"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    PublicMeasureNavigation:
      type: object
      additionalProperties: false
      required:
        - measure_id
        - position
        - total_items
        - previous_measure_id
        - next_measure_id
      properties:
        measure_id:
          type: string
        position:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 1
        previous_measure_id:
          type: [string, "null"]
        next_measure_id:
          type: [string, "null"]
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string

openapi: 3.1.0
info:
  title: CMS Quality Intelligence API
  version: 0.1.0
  description: |
    Public measure browsing and protected, read-only review of staged CMS
    evidence. Public endpoints return only source-backed records approved for
    release; private drafts remain confined to authenticated admin endpoints.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: System
  - name: Public measures
  - name: Admin review
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API availability
      responses:
        "200":
          description: API process is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/performance-years:
    get:
      operationId: listPerformanceYears
      tags: [Public measures]
      summary: List publicly available performance years
      responses:
        "200":
          description: Available performance years and the default comparison pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceYearList"
  /api/measures:
    get:
      operationId: listMeasures
      tags: [Public measures]
      summary: Search and filter publicly approved measures
      description: |
        Returns only fields approved for public release. Absence from extracted
        source material must not be interpreted as removal from a program.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PerformanceYear"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
        - $ref: "#/components/parameters/ChangeStatus"
        - $ref: "#/components/parameters/AffectedField"
        - $ref: "#/components/parameters/VerificationStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated public measure results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasurePage"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}:
    get:
      operationId: getMeasure
      tags: [Public measures]
      summary: Get a publicly approved measure profile
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
      responses:
        "200":
          description: Public measure identity, version summaries, evidence, and freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasureDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}/versions:
    get:
      operationId: listMeasureVersions
      tags: [Public measures]
      summary: List publicly approved year-specific measure versions
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: performance_year
          in: query
          required: false
          description: Optionally select one available performance year.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: Approved versions with explicit field availability states.
          content:
            application/json:
              schema:
                type: object
                required: [measure_id, versions]
                properties:
                  measure_id:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeasureVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/session:
    get:
      operationId: getAdminSession
      tags: [Admin review]
      summary: Inspect administrator authentication state
      responses:
        "200":
          description: Current authentication and configuration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
    post:
      operationId: createAdminSession
      tags: [Admin review]
      summary: Create a secure administrator session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Authenticated session. The signed token is set in an HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "503":
          description: Administrator authentication is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteAdminSession
      tags: [Admin review]
      summary: End the current administrator session
      responses:
        "200":
          description: The browser session cookie has been cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
  /api/admin/review-summary:
    get:
      operationId: getAdminReviewSummary
      tags: [Admin review]
      summary: Count private records awaiting review
      security:
        - AdminSessionCookie: []
      responses:
        "200":
          description: Private staging counts; no record is published by this operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminReviewSummary"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
  /api/admin/measures:
    get:
      operationId: listAdminMeasures
      tags: [Admin review]
      summary: List non-public measures staged for review
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated private review records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeasurePage"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/admin/measures/{measure_id}:
    get:
      operationId: getAdminMeasure
      tags: [Admin review]
      summary: Inspect a private measure and its source-backed field candidates
      security:
        - AdminSessionCookie: []
      parameters:
        - $ref: "#/components/parameters/MeasureId"
      responses:
        "200":
          description: Private draft memberships, variants, and review candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMeasureDetail"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/admin/review-items/{review_item_id}:
    patch:
      operationId: reviewAdminFieldCandidate
      tags: [Admin review]
      summary: Record a review decision for one private field candidate
      description: |
        Updates the current private review state and appends an immutable audit event.
        This operation never publishes a measure or exposes the candidate publicly.
      security:
        - AdminSessionCookie: []
      parameters:
        - name: review_item_id
          in: path
          required: true
          description: Stable identifier for the private field candidate under review.
          schema:
            type: string
            minLength: 1
        - name: X-CMSQI-Admin-Action
          in: header
          required: true
          description: Explicit acknowledgement of the private review mutation.
          schema:
            type: string
            const: review-decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCandidateDecisionRequest"
      responses:
        "200":
          description: Updated private candidate including its append-only review history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFieldCandidate"
        "401":
          $ref: "#/components/responses/AdminUnauthorized"
        "403":
          description: The explicit administrator action header is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval is blocked because newer source evidence was detected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  securitySchemes:
    AdminSessionCookie:
      type: apiKey
      in: cookie
      name: cmsqi_admin_session
  parameters:
    MeasureId:
      name: measure_id
      in: path
      required: true
      description: Stable application measure identifier.
      schema:
        type: string
        minLength: 1
    SearchQuery:
      name: q
      in: query
      required: false
      description: Search approved measure ID, name, or description.
      schema:
        type: string
        maxLength: 200
    PerformanceYear:
      name: performance_year
      in: query
      required: false
      description: Require publicly verified membership in this performance year.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    FromYear:
      name: from_year
      in: query
      required: false
      description: Baseline performance year for the requested comparison.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    ToYear:
      name: to_year
      in: query
      required: false
      description: Comparison performance year for the requested comparison.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    ChangeStatus:
      name: change_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ChangeStatus"
    AffectedField:
      name: affected_field
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AffectedField"
    VerificationStatus:
      name: verification_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PublicVerificationStatus"
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    AdminUnauthorized:
      description: A valid administrator session is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The requested public resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: One or more request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ChangeStatus:
      type: string
      description: |
        Approved year-pair comparison state. `unknown` is distinct from a
        verified removal and is used when evidence is incomplete.
      enum: [added, removed, modified, unchanged, unknown]
    AffectedField:
      type: string
      enum:
        - measure_set
        - definition
        - numerator
        - denominator
        - exclusions
        - eligibility
        - calculation_logic
    PublicVerificationStatus:
      type: string
      description: Public-safe verification or freshness state.
      enum: [verified, partially_verified, source_update_detected]
    FieldAvailability:
      type: string
      description: Explicitly distinguishes a value from unavailable or unresolved evidence.
      enum: [available, unavailable, unresolved]
    PerformanceYearList:
      type: object
      required: [years, default_from_year, default_to_year]
      properties:
        years:
          type: array
          items:
            type: integer
          minItems: 1
          uniqueItems: true
        default_from_year:
          type: integer
        default_to_year:
          type: integer
      example:
        years: [2025, 2026]
        default_from_year: 2025
        default_to_year: 2026
    EvidenceReference:
      type: object
      required: [evidence_id, source_revision_id, document_title, official_url, excerpt]
      properties:
        evidence_id:
          type: string
        source_revision_id:
          type: string
        document_title:
          type: string
        official_url:
          type: string
          format: uri
          pattern: "^https://"
        locator:
          type: [string, "null"]
          description: Page, section, or another stable locator when available.
        excerpt:
          type: string
    Freshness:
      type: object
      required: [last_source_check_at, verification_status]
      properties:
        last_verified_at:
          type: [string, "null"]
          format: date-time
        last_source_check_at:
          type: string
          format: date-time
        verification_status:
          $ref: "#/components/schemas/PublicVerificationStatus"
        newer_revision_detected:
          type: boolean
    SpecificationField:
      type: object
      required: [field, availability, value, evidence]
      properties:
        field:
          $ref: "#/components/schemas/AffectedField"
        availability:
          $ref: "#/components/schemas/FieldAvailability"
        value:
          type: [string, "null"]
          description: Null unless an approved public value is available.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
    MeasureVersion:
      type: object
      required:
        - version_id
        - performance_year
        - program
        - is_program_member
        - fields
      properties:
        version_id:
          type: string
        performance_year:
          type: integer
        program:
          type: string
        is_program_member:
          type: boolean
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SpecificationField"
    PublicMeasureSummary:
      type: object
      required:
        - measure_id
        - name
        - description
        - performance_years
        - change_status
        - affected_fields
        - freshness
      properties:
        measure_id:
          type: string
        name:
          type: string
        description:
          type: string
        performance_years:
          type: array
          items:
            type: integer
          uniqueItems: true
        change_status:
          $ref: "#/components/schemas/ChangeStatus"
        affected_fields:
          type: array
          items:
            $ref: "#/components/schemas/AffectedField"
          uniqueItems: true
        freshness:
          $ref: "#/components/schemas/Freshness"
      example:
        measure_id: DEMO-001
        name: Fictional Preventive Care Measure
        description: Explicitly fictional contract example; not a verified CMS measure.
        performance_years: [2025, 2026]
        change_status: unknown
        affected_fields: [eligibility]
        freshness:
          last_verified_at: null
          last_source_check_at: "2026-10-16T12:00:00Z"
          verification_status: partially_verified
          newer_revision_detected: false
    PublicMeasureDetail:
      allOf:
        - $ref: "#/components/schemas/PublicMeasureSummary"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/MeasureVersion"
    PaginationMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    PublicMeasurePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicMeasureSummary"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 1000
          format: password
    AdminSession:
      type: object
      required: [configured, authenticated, username]
      properties:
        configured:
          type: boolean
        authenticated:
          type: boolean
        username:
          type: [string, "null"]
    AdminReviewSummary:
      type: object
      required:
        - private_measures
        - draft_versions
        - pending_candidates
        - decided_candidates
        - source_revisions
        - newer_revision_flags
      properties:
        private_measures: {type: integer, minimum: 0}
        draft_versions: {type: integer, minimum: 0}
        pending_candidates: {type: integer, minimum: 0}
        decided_candidates: {type: integer, minimum: 0}
        source_revisions: {type: integer, minimum: 0}
        newer_revision_flags: {type: integer, minimum: 0}
    AdminMeasureSummary:
      type: object
      required:
        - measure_id
        - name
        - description
        - performance_years
        - draft_versions
        - pending_candidates
        - decided_candidates
        - source_documents
        - newer_revision_detected
        - last_source_check_at
      properties:
        measure_id: {type: string}
        name: {type: string}
        description: {type: string}
        performance_years:
          type: array
          items: {type: integer}
          uniqueItems: true
        draft_versions: {type: integer, minimum: 0}
        pending_candidates: {type: integer, minimum: 0}
        decided_candidates: {type: integer, minimum: 0}
        source_documents: {type: integer, minimum: 0}
        newer_revision_detected: {type: boolean}
        last_source_check_at:
          type: [string, "null"]
          format: date-time
    AdminMeasurePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminMeasureSummary"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    PublicationState:
      type: string
      enum: [draft, published, withdrawn]
    CandidateReviewDecision:
      type: string
      enum: [pending, approve, needs_revision, not_applicable]
    AdminReviewDecision:
      type: string
      enum: [approve, needs_revision, not_applicable]
    CollectionType:
      type: string
      enum:
        - program_roster
        - ecqm
        - mips_cqm
        - medicare_cqm
        - cahps_survey
        - administrative_claims
    AdminMembership:
      type: object
      required:
        - performance_year
        - program
        - is_program_member
        - publication_state
        - verified_at
      properties:
        performance_year: {type: integer}
        program: {type: string}
        is_program_member: {type: boolean}
        publication_state:
          $ref: "#/components/schemas/PublicationState"
        verified_at:
          type: [string, "null"]
          format: date-time
    AdminFieldCandidate:
      type: object
      required:
        - review_item_id
        - field_name
        - candidate_value
        - source_excerpt
        - extraction_status
        - evidence_locator
        - review_decision
        - reviewed_value
        - reviewer_name
        - reviewed_at
        - reviewer_notes
        - source_id
        - source_revision_id
        - source_title
        - official_url
        - source_content_hash
        - review_history
      properties:
        review_item_id: {type: string}
        field_name: {type: string}
        candidate_value: {type: string}
        source_excerpt: {type: [string, "null"]}
        extraction_status: {type: string}
        evidence_locator: {type: string}
        review_decision:
          $ref: "#/components/schemas/CandidateReviewDecision"
        reviewed_value: {type: [string, "null"]}
        reviewer_name: {type: [string, "null"]}
        reviewed_at:
          type: [string, "null"]
          format: date-time
        reviewer_notes: {type: [string, "null"]}
        source_id: {type: string}
        source_revision_id: {type: string}
        source_title: {type: string}
        official_url:
          type: string
          format: uri
          pattern: "^https://"
        source_content_hash: {type: string}
        review_history:
          type: array
          items:
            $ref: "#/components/schemas/AdminCandidateReview"
    AdminCandidateReview:
      type: object
      required:
        - decision
        - reviewed_value
        - reviewer_name
        - reviewed_at
        - reviewer_notes
      properties:
        decision:
          $ref: "#/components/schemas/CandidateReviewDecision"
        reviewed_value: {type: [string, "null"]}
        reviewer_name: {type: string}
        reviewed_at:
          type: string
          format: date-time
        reviewer_notes: {type: [string, "null"]}
    AdminCandidateDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/AdminReviewDecision"
        reviewed_value:
          type: [string, "null"]
          maxLength: 20000
        reviewer_notes:
          type: [string, "null"]
          maxLength: 4000
    AdminMeasureVersion:
      type: object
      required:
        - version_id
        - performance_year
        - program
        - collection_type
        - specification_identifier
        - publication_state
        - verification_status
        - newer_revision_detected
        - last_source_check_at
        - candidates
      properties:
        version_id: {type: string}
        performance_year: {type: integer}
        program: {type: string}
        collection_type:
          $ref: "#/components/schemas/CollectionType"
        specification_identifier: {type: [string, "null"]}
        publication_state:
          $ref: "#/components/schemas/PublicationState"
        verification_status:
          $ref: "#/components/schemas/PublicVerificationStatus"
        newer_revision_detected: {type: boolean}
        last_source_check_at:
          type: string
          format: date-time
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/AdminFieldCandidate"
    AdminMeasureDetail:
      type: object
      required: [measure_id, name, description, is_public, memberships, versions]
      properties:
        measure_id: {type: string}
        name: {type: string}
        description: {type: string}
        is_public: {type: boolean, const: false}
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/AdminMembership"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/AdminMeasureVersion"
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true

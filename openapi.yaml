openapi: 3.1.0
info:
  title: CMS Quality Intelligence API
  version: 0.1.0
  description: |
    Initial public contract for the M1 Measure Explorer. CMS facts returned by
    these endpoints must be source-backed and approved for public release.
    Protected operations will be added under `/api/admin/...` in M3.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: System
  - name: Public measures
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check API availability
      responses:
        "200":
          description: API process is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/performance-years:
    get:
      operationId: listPerformanceYears
      tags: [Public measures]
      summary: List publicly available performance years
      responses:
        "200":
          description: Available performance years and the default comparison pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceYearList"
  /api/measures:
    get:
      operationId: listMeasures
      tags: [Public measures]
      summary: Search and filter publicly approved measures
      description: |
        Returns only fields approved for public release. Absence from extracted
        source material must not be interpreted as removal from a program.
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/PerformanceYear"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
        - $ref: "#/components/parameters/ChangeStatus"
        - $ref: "#/components/parameters/AffectedField"
        - $ref: "#/components/parameters/VerificationStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paginated public measure results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasurePage"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}:
    get:
      operationId: getMeasure
      tags: [Public measures]
      summary: Get a publicly approved measure profile
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - $ref: "#/components/parameters/FromYear"
        - $ref: "#/components/parameters/ToYear"
      responses:
        "200":
          description: Public measure identity, version summaries, evidence, and freshness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMeasureDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/measures/{measure_id}/versions:
    get:
      operationId: listMeasureVersions
      tags: [Public measures]
      summary: List publicly approved year-specific measure versions
      parameters:
        - $ref: "#/components/parameters/MeasureId"
        - name: performance_year
          in: query
          required: false
          description: Optionally select one available performance year.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        "200":
          description: Approved versions with explicit field availability states.
          content:
            application/json:
              schema:
                type: object
                required: [measure_id, versions]
                properties:
                  measure_id:
                    type: string
                  versions:
                    type: array
                    items:
                      $ref: "#/components/schemas/MeasureVersion"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
components:
  parameters:
    MeasureId:
      name: measure_id
      in: path
      required: true
      description: Stable application measure identifier.
      schema:
        type: string
        minLength: 1
    SearchQuery:
      name: q
      in: query
      required: false
      description: Search approved measure ID, name, or description.
      schema:
        type: string
        maxLength: 200
    PerformanceYear:
      name: performance_year
      in: query
      required: false
      description: Require publicly verified membership in this performance year.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    FromYear:
      name: from_year
      in: query
      required: false
      description: Baseline performance year for the requested comparison.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    ToYear:
      name: to_year
      in: query
      required: false
      description: Comparison performance year for the requested comparison.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    ChangeStatus:
      name: change_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ChangeStatus"
    AffectedField:
      name: affected_field
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AffectedField"
    VerificationStatus:
      name: verification_status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/PublicVerificationStatus"
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    NotFound:
      description: The requested public resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ValidationError:
      description: One or more request parameters are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ChangeStatus:
      type: string
      description: |
        Approved year-pair comparison state. `unknown` is distinct from a
        verified removal and is used when evidence is incomplete.
      enum: [added, removed, modified, unchanged, unknown]
    AffectedField:
      type: string
      enum:
        - measure_set
        - definition
        - numerator
        - denominator
        - exclusions
        - eligibility
        - calculation_logic
    PublicVerificationStatus:
      type: string
      description: Public-safe verification or freshness state.
      enum: [verified, partially_verified, source_update_detected]
    FieldAvailability:
      type: string
      description: Explicitly distinguishes a value from unavailable or unresolved evidence.
      enum: [available, unavailable, unresolved]
    PerformanceYearList:
      type: object
      required: [years, default_from_year, default_to_year]
      properties:
        years:
          type: array
          items:
            type: integer
          minItems: 1
          uniqueItems: true
        default_from_year:
          type: integer
        default_to_year:
          type: integer
      example:
        years: [2025, 2026]
        default_from_year: 2025
        default_to_year: 2026
    EvidenceReference:
      type: object
      required: [evidence_id, source_revision_id, document_title, official_url, excerpt]
      properties:
        evidence_id:
          type: string
        source_revision_id:
          type: string
        document_title:
          type: string
        official_url:
          type: string
          format: uri
          pattern: "^https://"
        locator:
          type: [string, "null"]
          description: Page, section, or another stable locator when available.
        excerpt:
          type: string
    Freshness:
      type: object
      required: [last_source_check_at, verification_status]
      properties:
        last_verified_at:
          type: [string, "null"]
          format: date-time
        last_source_check_at:
          type: string
          format: date-time
        verification_status:
          $ref: "#/components/schemas/PublicVerificationStatus"
        newer_revision_detected:
          type: boolean
    SpecificationField:
      type: object
      required: [field, availability, value, evidence]
      properties:
        field:
          $ref: "#/components/schemas/AffectedField"
        availability:
          $ref: "#/components/schemas/FieldAvailability"
        value:
          type: [string, "null"]
          description: Null unless an approved public value is available.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceReference"
    MeasureVersion:
      type: object
      required:
        - version_id
        - performance_year
        - program
        - is_program_member
        - fields
      properties:
        version_id:
          type: string
        performance_year:
          type: integer
        program:
          type: string
        is_program_member:
          type: boolean
        fields:
          type: array
          items:
            $ref: "#/components/schemas/SpecificationField"
    PublicMeasureSummary:
      type: object
      required:
        - measure_id
        - name
        - description
        - performance_years
        - change_status
        - affected_fields
        - freshness
      properties:
        measure_id:
          type: string
        name:
          type: string
        description:
          type: string
        performance_years:
          type: array
          items:
            type: integer
          uniqueItems: true
        change_status:
          $ref: "#/components/schemas/ChangeStatus"
        affected_fields:
          type: array
          items:
            $ref: "#/components/schemas/AffectedField"
          uniqueItems: true
        freshness:
          $ref: "#/components/schemas/Freshness"
      example:
        measure_id: DEMO-001
        name: Fictional Preventive Care Measure
        description: Explicitly fictional contract example; not a verified CMS measure.
        performance_years: [2025, 2026]
        change_status: unknown
        affected_fields: [eligibility]
        freshness:
          last_verified_at: null
          last_source_check_at: "2026-10-16T12:00:00Z"
          verification_status: partially_verified
          newer_revision_detected: false
    PublicMeasureDetail:
      allOf:
        - $ref: "#/components/schemas/PublicMeasureSummary"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/MeasureVersion"
    PaginationMeta:
      type: object
      required: [page, page_size, total_items, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
    PublicMeasurePage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicMeasureSummary"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms_quality_demo}
      POSTGRES_USER: ${POSTGRES_USER:-cms_quality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_quality_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cms_quality_postgres:/var/lib/postgresql/data

volumes:
  cms_quality_postgres:

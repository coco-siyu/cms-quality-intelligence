services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms_quality_demo}
      POSTGRES_USER: ${POSTGRES_USER:-cms_quality}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cms_quality_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cms_quality_postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      CMSQI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cms_quality}:${POSTGRES_PASSWORD:-cms_quality_dev}@postgres:5432/${POSTGRES_DB:-cms_quality_demo}
      CMSQI_ADMIN_SESSION_SECURE: ${CMSQI_ADMIN_SESSION_SECURE:-false}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: api
        VITE_API_BASE_URL: ""
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cms_quality_postgres:
